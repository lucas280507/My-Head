<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Página não encontrada | My-Head</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0a0e17;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(79,172,254,0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(121,40,202,0.12) 0%, transparent 40%);
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7928ca 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .btn-neon {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #030712;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 0.6rem 1.5rem;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,242,254,0.5);
            color: #030712;
        }
    </style>
</head>
<body>
    <div class="text-center">
        <div class="error-code mb-3">404</div>
        <h1 class="h3 fw-bold mb-2">Página não encontrada</h1>
        <p class="text-secondary mb-4">A página que você procura não existe ou foi movida.</p>
        <a href="index.html" class="btn btn-neon">
            <i class="bi bi-house-door me-2"></i> Voltar para o Início
        </a>
    </div>
</body>
</html>
